<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>韩语错题＋生词复习器</title>
<style>
:root{
  --bg:#f5f7fb;--card:#fff;--text:#202636;--muted:#697386;
  --line:#e5e9f2;--primary:#5577ff;--primary2:#405fe0;
  --ok:#23936b;--okbg:#eaf8f2;--bad:#d95368;--badbg:#fff0f2;
  --shadow:0 8px 28px rgba(38,48,75,.08);--radius:18px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR","Microsoft YaHei",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1180px;margin:auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.logo{font-size:24px;font-weight:800}
.logo small{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:4px}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;color:var(--text)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.danger{color:var(--bad)}
.grid{display:grid;grid-template-columns:250px 1fr;gap:20px}
.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.sidebar{padding:16px;height:max-content;position:sticky;top:16px}
.nav-title{font-size:12px;color:var(--muted);margin:8px 10px}
.nav{display:flex;flex-direction:column;gap:6px}
.nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:11px;color:var(--text)}
.nav button.active,.nav button:hover{background:#eef2ff;color:var(--primary2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{padding:16px}
.stat .n{font-size:25px;font-weight:800}.stat .l{color:var(--muted);font-size:12px;margin-top:4px}
.controls{padding:14px;margin-bottom:18px;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:9px}
input,select{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 11px;outline:none}
input:focus,select:focus{border-color:var(--primary)}
.quiz{padding:28px}
.quiz-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.tag{display:inline-block;background:#f0f3f9;color:#59647a;border-radius:999px;padding:4px 8px;font-size:11px;margin:3px}
.question{font-size:27px;font-weight:750;line-height:1.5;margin:30px 0 22px;white-space:pre-wrap}
.options{display:grid;gap:11px}
.option{width:100%;padding:15px 16px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:13px;transition:.15s}
.option:hover:not(:disabled){border-color:#aebcff;background:#f8f9ff}
.option.correct{border-color:var(--ok);background:var(--okbg)}
.option.wrong{border-color:var(--bad);background:var(--badbg)}
.option:disabled{cursor:default}
.explain{margin-top:18px;padding:16px;border-radius:13px;background:#f7f8fc;border:1px solid var(--line);line-height:1.7}
.result-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.list{padding:16px}.item{padding:15px 5px;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}
.item-q{font-weight:700;margin-bottom:8px}.item-meta{color:var(--muted);font-size:12px}
.empty{text-align:center;padding:50px;color:var(--muted)}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(20,25,40,.4);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal-box{max-width:680px;width:100%;background:#fff;border-radius:18px;padding:22px}
.modal-box h2{margin-top:0}.modal-box textarea{width:100%;height:280px;border:1px solid var(--line);border-radius:12px;padding:12px;font-family:ui-monospace,monospace;font-size:12px}
@media(max-width:850px){
 .grid{grid-template-columns:1fr}.sidebar{position:static}.stats{grid-template-columns:repeat(2,1fr)}
 .controls{grid-template-columns:1fr 1fr}.question{font-size:23px}
}
@media(max-width:520px){
 .app{padding:12px}.controls{grid-template-columns:1fr}.header-actions .btn{padding:8px 9px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">한글 공부 <small>韩语错题＋生词复习器</small></div>
  <div class="header-actions">
    <button class="btn" onclick="openData()">导入 / 导出</button>
    <button class="btn" onclick="resetProgress()">重置学习记录</button>
  </div>
</header>

<div class="grid">
<aside class="panel sidebar">
  <div class="nav-title">练习</div>
  <div class="nav">
    <button class="active" data-view="all">全部题目</button>
    <button data-view="vocabulary">生词</button>
    <button data-view="confusable">易混词</button>
    <button data-view="grammar">语法</button>
    <button data-view="wrong_answer">错题</button>
  </div>
  <div class="nav-title" style="margin-top:20px">其他</div>
  <div class="nav">
    <button data-view="favorites">收藏</button>
    <button data-view="unlearned">未做题</button>
  </div>
</aside>

<main>
  <section class="stats">
    <div class="card stat"><div class="n" id="total">0</div><div class="l">题库总数</div></div>
    <div class="card stat"><div class="n" id="done">0</div><div class="l">已作答</div></div>
    <div class="card stat"><div class="n" id="accuracy">0%</div><div class="l">正确率</div></div>
    <div class="card stat"><div class="n" id="wrong">0</div><div class="l">错题数</div></div>
  </section>

  <section class="card controls">
    <input id="search" placeholder="搜索韩语、中文、题目、标签…" oninput="render()">
    <select id="subFilter" onchange="render()"><option value="">全部题型</option></select>
    <select id="tagFilter" onchange="render()"><option value="">全部标签</option></select>
    <select id="sortFilter" onchange="render()">
      <option value="default">默认顺序</option>
      <option value="wrong">错误次数最多</option>
      <option value="new">未作答优先</option>
      <option value="favorite">收藏优先</option>
    </select>
  </section>

  <section id="quiz" class="card quiz"></section>
  <section id="list" class="card list hidden"></section>
</main>
</div>
</div>

<div id="modal" class="modal hidden">
 <div class="modal-box">
   <h2>题库数据</h2>
   <p style="color:#697386;font-size:13px">导出当前完整题库与学习记录，或粘贴 JSON 导入。导入相同 ID 的题目会更新，不同 ID 会新增。</p>
   <textarea id="dataText"></textarea>
   <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
     <button class="btn" onclick="downloadData()">下载 JSON</button>
     <button class="btn" onclick="importData()">导入</button>
     <button class="btn" onclick="closeData()">关闭</button>
   </div>
 </div>
</div>

const STORAGE_KEY = "korean_quiz_state_v1";
let state = loadState();
let view = "all";
let current = null;
let answered = false;

function loadState(){
  try{
    const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
    return s && Array.isArray(s.questions) ? s : {questions:DEFAULT_QUESTIONS.map(q=>({...q}))};
  }catch(e){return {questions:DEFAULT_QUESTIONS.map(q=>({...q}))}}
}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
function qs(){return state.questions}
function labelCat(c){return {vocabulary:"生词",confusable:"易混词",grammar:"语法",wrong_answer:"错题"}[c]||c}
function labelSub(s){
 const m={meaning:"选意思",word:"选单词",pronunciation:"选读音",spelling:"选拼写",context:"语境辨析",particle:"助词",reason:"原因",purpose:"目的",time:"时间",change:"变化"};
 return m[s]||s;
}
function filtered(){
 let arr=[...qs()];
 if(view==="favorites") arr=arr.filter(q=>q.favorite);
 else if(view==="unlearned") arr=arr.filter(q=>(q.correctCount+q.wrongCount)===0);
 else if(view!=="all") arr=arr.filter(q=>q.category===view);
 const s=document.getElementById("search").value.trim().toLowerCase();
 if(s) arr=arr.filter(q=>JSON.stringify(q).toLowerCase().includes(s));
 const sub=document.getElementById("subFilter").value;
 if(sub) arr=arr.filter(q=>q.subCategory===sub);
 const tag=document.getElementById("tagFilter").value;
 if(tag) arr=arr.filter(q=>(q.tags||[]).includes(tag));
 const sort=document.getElementById("sortFilter").value;
 if(sort==="wrong") arr.sort((a,b)=>b.wrongCount-a.wrongCount);
 if(sort==="new") arr.sort((a,b)=>(a.correctCount+a.wrongCount)-(b.correctCount+b.wrongCount));
 if(sort==="favorite") arr.sort((a,b)=>Number(b.favorite)-Number(a.favorite));
 return arr;
}
function updateFilters(){
 const subs=[...new Set(qs().map(q=>q.subCategory))].sort();
 const tags=[...new Set(qs().flatMap(q=>q.tags||[]))].sort();
 const sf=document.getElementById("subFilter"), tf=document.getElementById("tagFilter");
 const sv=sf.value,tv=tf.value;
 sf.innerHTML='<option value="">全部题型</option>'+subs.map(x=>`<option value="${esc(x)}">${esc(labelSub(x))}</option>`).join("");
 tf.innerHTML='<option value="">全部标签</option>'+tags.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");
 sf.value=subs.includes(sv)?sv:"";tf.value=tags.includes(tv)?tv:"";
}
function stats(){
 const all=qs(),done=all.filter(q=>q.correctCount+q.wrongCount>0);
 const correct=all.reduce((n,q)=>n+q.correctCount,0),wrong=all.reduce((n,q)=>n+q.wrongCount,0);
 document.getElementById("total").textContent=all.length;
 document.getElementById("done").textContent=done.length;
 document.getElementById("wrong").textContent=all.filter(q=>q.wrongCount>0).length;
 document.getElementById("accuracy").textContent=(correct+wrong?Math.round(correct/(correct+wrong)*100):0)+"%";
}
function render(){
 stats();updateFilters();
 const arr=filtered();
 if(current && !arr.some(q=>q.id===current.id)) current=null;
 if(!current && arr.length) current=arr[0];
 renderQuiz(arr);
}
function renderQuiz(arr){
 const el=document.getElementById("quiz"), list=document.getElementById("list");
 list.classList.add("hidden");el.classList.remove("hidden");
 if(!arr.length){el.innerHTML='<div class="empty">当前筛选没有题目。<br>可以换一个分类或导入更多题库。</div>';return}
 const q=current||arr[0];
 const idx=arr.findIndex(x=>x.id===q.id);
 el.innerHTML=`
 <div class="quiz-top">
   <span>${idx+1} / ${arr.length}　${labelCat(q.category)} · ${labelSub(q.subCategory)}</span>
   <button class="btn" onclick="toggleFavorite('${q.id}')">${q.favorite?"★ 已收藏":"☆ 收藏"}</button>
 </div>
 <div>${(q.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
 <div class="question">${esc(q.question)}</div>
 <div class="options">${q.options.map((o,i)=>`<button class="option" id="opt-${i}" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}</div>
 <div id="feedback"></div>
 <div class="result-actions">
   <button class="btn" onclick="prevQuestion()">上一题</button>
   <button class="btn primary" onclick="nextQuestion()">下一题</button>
 </div>`;
}
function answer(i){
 if(answered)return;
 answered=true;
 const q=current;
 const ok=i===q.answer;
 q[ok?"correctCount":"wrongCount"]++;
 document.querySelectorAll(".option").forEach((b,n)=>{
   b.disabled=true;
   if(n===q.answer)b.classList.add("correct");
   if(n===i && !ok)b.classList.add("wrong");
 });
 document.getElementById("feedback").innerHTML=`
 <div class="explain">
   <b>${ok?"✓ 回答正确":"✗ 回答错误"}</b><br>
   正确答案：${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}
   <br><br>${esc(q.explanation||"")}
   ${q.example?`<br><br><b>例句：</b>${esc(q.example)}<br>${esc(q.translation||"")}`:""}
 </div>`;
 save();stats();
}
function nextQuestion(){
 const arr=filtered();if(!arr.length)return;
 let i=arr.findIndex(q=>q.id===current.id);current=arr[(i+1)%arr.length];answered=false;renderQuiz(arr);
}
function prevQuestion(){
 const arr=filtered();if(!arr.length)return;
 let i=arr.findIndex(q=>q.id===current.id);current=arr[(i-1+arr.length)%arr.length];answered=false;renderQuiz(arr);
}
function toggleFavorite(id){
 const q=qs().find(q=>q.id===id);if(!q)return;q.favorite=!q.favorite;save();render();
}
function setView(v){
 view=v;current=null;answered=false;
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===v));
 render();
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>setView(b.dataset.view));

function openData(){
 document.getElementById("dataText").value=JSON.stringify({schemaVersion:"1.0",language:"ko",title:"韩语错题＋生词复习器",questions:qs()},null,2);
 document.getElementById("modal").classList.remove("hidden");
}
function closeData(){document.getElementById("modal").classList.add("hidden")}
function importData(){
 try{
   const obj=JSON.parse(document.getElementById("dataText").value);
   const incoming=Array.isArray(obj)?obj:obj.questions;
   if(!Array.isArray(incoming))throw Error("没有找到 questions 数组");
   const map=new Map(qs().map(q=>[q.id,q]));
   incoming.forEach(q=>{
     if(!q.id)throw Error("存在没有 id 的题目");
     const old=map.get(q.id);
     map.set(q.id,{...q,correctCount:old?.correctCount??q.correctCount??0,wrongCount:old?.wrongCount??q.wrongCount??0,favorite:old?.favorite??q.favorite??false});
   });
   state.questions=[...map.values()];save();current=null;closeData();render();
   alert("导入成功，共 "+state.questions.length+" 道题。");
 }catch(e){alert("导入失败："+e.message)}
}
function downloadData(){
 const blob=new Blob([JSON.stringify({schemaVersion:"1.0",language:"ko",title:"韩语错题＋生词复习器",questions:qs()},null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="korean_quiz_backup.json";a.click();URL.revokeObjectURL(a.href);
}
function resetProgress(){
 if(!confirm("确定重置所有答题次数和收藏吗？题目本身不会删除。"))return;
 qs().forEach(q=>{q.correctCount=0;q.wrongCount=0;q.favorite=false});save();current=null;answered=false;render();
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
render();
</script>
</body>
